services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agromax_pilot
      POSTGRES_USER: agromax_pilot
      POSTGRES_PASSWORD: local-isolated-pilot
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - pilot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agromax_pilot"]
      interval: 3s
      timeout: 3s
      retries: 15
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.terra-brain
    command: ["node", "dist/commercial-migrate.mjs"]
    environment:
      AGROMAX_DATABASE_URL: postgres://agromax_pilot:local-isolated-pilot@postgres:5432/agromax_pilot
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: Dockerfile.terra-brain
    restart: unless-stopped
    environment:
      AGROMAX_TERRA_BRAIN_WORKER_DATABASE_URL: postgres://agromax_pilot:local-isolated-pilot@postgres:5432/agromax_pilot
      AGROMAX_TERRA_BRAIN_ENABLED: "true"
      AGROMAX_TERRA_BRAIN_ORGS: ${AGROMAX_TERRA_BRAIN_ORGS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pilot-db:
